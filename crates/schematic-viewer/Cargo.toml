[package]
name = "schematic-viewer"
version = "0.14.0"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

# No lib — everything is in main.rs for simplicity
[[bin]]
name = "schematic-viewer"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
notify = "8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Not a workspace member (Tauri app, built separately), so this is a plain
# path dependency rather than `.workspace = true`.
kidig-schematic-editor = { path = "../kidig-schematic-editor" }

[dev-dependencies]
tempfile = "3"

[package.metadata.bundle]
identifier = "com.kidig-mcp.schematic-viewer"
icon = ["icons/icon.png"]

[build-dependencies]
tauri-build = "2"

# Shipped inside the PCM package next to kidig-mcp; see the workspace
# Cargo.toml for why release builds are stripped. The Release workflow adds
# link-time optimization through CARGO_PROFILE_RELEASE_* variables.
[profile.release]
strip = "symbols"
