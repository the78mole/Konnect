name: CI

# Pushes and PRs run the Linux lanes only. The Windows and macOS legs of
# "Check & Test" and the Windows-only schematic viewer cost most of the CI
# minutes and rarely catch anything Linux does not, so they run weekly on
# main and on demand (workflow_dispatch) instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC, ahead of the weekly E2E run
  workflow_dispatch:

# A new push to the same branch/PR supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest verifies every push and PR; windows/macos join only
        # on the weekly schedule and on manual dispatch.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc@3.23.4
          fallback: none
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --locked
      # Fast, named contract gate for the adopted outcome catalogue and the
      # reviewed legacy-debt ratchet. The full test step below remains the
      # regression gate; this makes contract drift immediately identifiable.
      - name: Reliability contract
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p kidig-core --locked reliability_contract -- --nocapture
      - name: Test (unit + integration)
        run: cargo test --workspace --locked --lib --tests
      # --doc cannot be combined with --lib/--tests; doctests broke silently
      # once (PR #49) because they were never run in CI.
      - name: Doctests
        run: cargo test --workspace --locked --doc

  # The KiCAD action plugin is Python, so cargo never sees it. Its only real
  # logic is the server-PID bookkeeping (#103), where an unconditional
  # os.remove let one KiCAD session delete another's record and leak an
  # unreapable server. The tests stub pcbnew/wx, so no KiCAD is needed.
  plugin:
    name: Plugin (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test
        run: python -m unittest discover -s plugin/tests -v

  # flake.nix pins its own toolchain, dependency set and build flags, so
  # nothing else in CI would notice it going stale — and it names things
  # that move: `-p kidig-mcp --bin kidig-mcp`, rust-toolchain.toml, and a
  # preCheck that supplies KIDIG_MCP_STATE_DIR for the tests that need a
  # writable state dir. Without this job it is broken-on-arrival the first
  # time any of those changes, and only Nix users find out.
  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Check flake metadata
        run: nix flake check --no-build
      - name: Build the package
        run: nix build .#kidig-mcp --print-build-logs

  # schematic-viewer is intentionally outside the workspace (Tauri app), so
  # --workspace never touches it. Without this job a viewer break ships
  # silently: release builds it with continue-on-error and the PCM scripts
  # omit a missing viewer binary without failing.
  viewer:
    name: Schematic viewer
    # Windows runner: weekly and on demand only (see the trigger comment).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: viewer
          workspaces: crates/schematic-viewer
      - name: Check
        run: cargo check --locked --manifest-path crates/schematic-viewer/Cargo.toml
      - name: Test
        run: cargo test --locked --manifest-path crates/schematic-viewer/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc@3.23.4
          fallback: none
      - uses: Swatinem/rust-cache@v2
      # --all-targets so tests, benches and examples are linted too. Without it
      # test code is never checked, and it had accumulated real findings: eight
      # `MutexGuard` held across an await, a dropped coordinate that left half
      # of a transform assertion unwritten, and a handful of style lints (#121).
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  # Dependency license gate (deny.toml). Dual licensing (AGPL + commercial)
  # means every dependency must be acceptable under BOTH — this job stops an
  # incompatible license entering via an innocuous-looking dependency bump.
  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  packaging:
    name: PCM packaging validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - name: Validate repository metadata
        run: python packaging/validate-pcm.py --metadata packaging/metadata.json

      # Stub binaries carry each platform's executable magic: the validator
      # checks a package's bundled binary against the platform it declares,
      # which is what stops a Windows-only zip from being offered to every OS.
      - name: Assemble Windows PCM zip with a stub binary and validate structure
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes("stub-kidig-mcp.exe", [byte[]](0x4D, 0x5A, 0x90, 0x00))
          ./packaging/build-pcm.ps1 -Version 0.0.0 -BinaryPath stub-kidig-mcp.exe `
            -Platform windows -OutDir dist
          python packaging/validate-pcm.py --zip dist/kidig-mcp-pcm-v0.0.0-windows.zip

      # build-pcm.sh is what the macOS and Linux release packages are built
      # with, so it gets the same structural check.
      - name: Assemble Linux PCM zip with a stub binary and validate structure
        run: |
          set -euo pipefail
          printf '\177ELF\002\001\001\000' > stub-kidig-mcp
          ./packaging/build-pcm.sh --version 0.0.0 --binary stub-kidig-mcp \
            --platform linux --out dist
          python packaging/validate-pcm.py --zip dist/kidig-mcp-pcm-v0.0.0-linux.zip

      # The all-platform package is what KiCad's repositories list. Merge
      # stub per-platform zips and run the same gate the release uses.
      - name: Assemble all-platform PCM zip from stub packages and validate
        run: |
          set -euo pipefail
          printf '\317\372\355\376' > stub-kidig-mcp-mac
          ./packaging/build-pcm.sh --version 0.0.0 --binary stub-kidig-mcp-mac \
            --platform macos --out dist
          python packaging/build-pcm-universal.py --version 0.0.0 \
            --windows dist/kidig-mcp-pcm-v0.0.0-windows.zip \
            --macos dist/kidig-mcp-pcm-v0.0.0-macos.zip \
            --linux dist/kidig-mcp-pcm-v0.0.0-linux.zip --out dist/universal
          python packaging/validate-pcm.py --zip dist/universal/kidig-mcp-pcm-v0.0.0.zip
          python packaging/build-pcm-repo.py --versions dist/universal \
            --base-url https://example.invalid/pcm --out dist/site
          test -f dist/site/repository.json
          test -f dist/site/kicad-addons/com.github.the78mole.kidig-mcp/metadata.json

      - name: Reject a package whose binary contradicts its platform
        run: |
          set -euo pipefail
          # The exact mistake v0.1.3 shipped: a Windows binary in a package
          # non-Windows users are offered. The gate must fail here.
          printf 'MZ\220\000' > stub-kidig-mcp-win
          ./packaging/build-pcm.sh --version 0.0.0 --binary stub-kidig-mcp-win \
            --platform linux --out dist-bad
          if python packaging/validate-pcm.py --zip dist-bad/kidig-mcp-pcm-v0.0.0-linux.zip; then
            echo "::error::validator accepted a Windows binary in a linux package"
            exit 1
          fi
          echo "OK: mismatched binary/platform correctly rejected"
